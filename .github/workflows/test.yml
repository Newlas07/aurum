name: Aurum 2.0 checks
on:
  pull_request:
  push:
    branches: [main, desenvolvimento-aurum-2]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aurum
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: aurum_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --check app.js && node --check server.js && node --check procurement.cjs
      - run: pnpm test
        env:
          AURUM_TEST_DATABASE_URL: postgresql://aurum:disposable-test-only@127.0.0.1:5432/aurum_test
      - run: pnpm audit --prod --audit-level high
